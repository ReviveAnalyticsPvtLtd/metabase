<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 3333 640"
  width="3333.333"
  height="640"
  preserveAspectRatio="xMidYBottom slice"
  fill="none"
>
  <defs>
    <!-- Ambient Horizon Glow -->
    <radialGradient
      id="horizon-ambient-glow"
      cx="50%"
      cy="70%"
      r="50%"
      fx="50%"
      fy="70%"
    >
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.18" />
      <stop offset="35%" stop-color="#0070F3" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#7928CA" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0070F3" stop-opacity="0" />
    </radialGradient>

    <!-- Primary Cyber Stream Gradient -->
    <linearGradient id="cyber-stream-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0.05" />
      <stop offset="20%" stop-color="#00DFD8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#0070F3" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#7928CA" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0070F3" stop-opacity="0.05" />
    </linearGradient>

    <!-- Secondary Harmonic Gradient -->
    <linearGradient id="cyber-stream-secondary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0" />
      <stop offset="25%" stop-color="#7928CA" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.65" />
      <stop offset="75%" stop-color="#0070F3" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0" />
    </linearGradient>

    <!-- Deep Wave Fill Gradient -->
    <linearGradient id="wave-fill-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0.09" />
      <stop offset="50%" stop-color="#00DFD8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Perspective Grid Depth Fade -->
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0" />
      <stop offset="30%" stop-color="#0070F3" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0070F3" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter for Vector Laser Lines -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Ambient Horizon Dome -->
  <rect x="0" y="160" width="3333" height="480" fill="url(#horizon-ambient-glow)" />

  <!-- 2. 3D Perspective Plane Wireframe (Vanishing at (1666, 420)) -->
  <g stroke="url(#grid-fade)" stroke-width="1.2">
    <!-- Converging Perspective Rays -->
    <line x1="1666" y1="420" x2="-400" y2="640" />
    <line x1="1666" y1="420" x2="50" y2="640" />
    <line x1="1666" y1="420" x2="480" y2="640" />
    <line x1="1666" y1="420" x2="880" y2="640" />
    <line x1="1666" y1="420" x2="1220" y2="640" />
    <line x1="1666" y1="420" x2="1480" y2="640" />
    <line x1="1666" y1="420" x2="1853" y2="640" />
    <line x1="1666" y1="420" x2="2113" y2="640" />
    <line x1="1666" y1="420" x2="2453" y2="640" />
    <line x1="1666" y1="420" x2="2853" y2="640" />
    <line x1="1666" y1="420" x2="3283" y2="640" />
    <line x1="1666" y1="420" x2="3733" y2="640" />

    <!-- Isometric Transverse Depth Lines -->
    <path d="M 0,442 Q 1666,424 3333,442" opacity="0.35" />
    <path d="M 0,475 Q 1666,450 3333,475" opacity="0.5" />
    <path d="M 0,520 Q 1666,485 3333,520" opacity="0.65" />
    <path d="M 0,575 Q 1666,532 3333,575" opacity="0.8" />
    <path d="M 0,638 Q 1666,588 3333,638" opacity="0.95" />
  </g>

  <!-- 3. Ambient Volumetric Wave Fill -->
  <path
    d="M 0,460 C 550,380 1100,530 1666,440 C 2233,350 2780,510 3333,430 L 3333,640 L 0,640 Z"
    fill="url(#wave-fill-deep)"
  />

  <!-- 4. Multi-Layer Harmonic Cybernetic Data Waves -->
  <!-- Layer A: Background Dashed Harmonic Wave -->
  <path
    d="M 0,510 C 450,570 1000,430 1566,500 C 2133,570 2680,420 3333,490"
    stroke="url(#cyber-stream-secondary)"
    stroke-width="1.8"
    stroke-dasharray="10 8"
    fill="none"
  />

  <!-- Layer B: Neon Laser Glow Wave Ribbon -->
  <path
    d="M 0,460 C 550,380 1100,530 1666,440 C 2233,350 2780,510 3333,430"
    stroke="url(#cyber-stream-primary)"
    stroke-width="3"
    fill="none"
    filter="url(#neon-glow)"
  />

  <!-- Layer C: High-Precision Crisp Stream -->
  <path
    d="M 0,460 C 550,380 1100,530 1666,440 C 2233,350 2780,510 3333,430"
    stroke="#00DFD8"
    stroke-width="1.5"
    stroke-opacity="0.9"
    fill="none"
  />

  <!-- Layer D: High Frequency Secondary Data Ribbon -->
  <path
    d="M 0,420 C 600,480 1200,370 1750,450 C 2300,520 2850,380 3333,440"
    stroke="url(#cyber-stream-primary)"
    stroke-width="1.6"
    fill="none"
  />

  <!-- 5. Fine Horizon Laser Beam -->
  <line
    x1="0"
    y1="420"
    x2="3333"
    y2="420"
    stroke="url(#cyber-stream-primary)"
    stroke-width="1.2"
    stroke-opacity="0.7"
  />

  <!-- 6. Constellation Data Nodes & Vertical Telemetry Beacons -->
  <g>
    <!-- Node 1: Left Peak -->
    <circle cx="550" cy="380" r="4.5" fill="#00DFD8" />
    <circle cx="550" cy="380" r="10" stroke="#00DFD8" stroke-width="1" stroke-opacity="0.4" fill="none" />
    <line x1="550" y1="380" x2="550" y2="640" stroke="#00DFD8" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.3" />

    <!-- Node 2: Left Mid Valley -->
    <circle cx="1100" cy="530" r="3.5" fill="#0070F3" />
    <circle cx="1100" cy="530" r="8" stroke="#0070F3" stroke-width="1" stroke-opacity="0.35" fill="none" />

    <!-- Node 3: Center Apex Beacon -->
    <circle cx="1666" cy="440" r="6" fill="#00DFD8" />
    <circle cx="1666" cy="440" r="14" stroke="#00DFD8" stroke-width="1.2" stroke-opacity="0.6" fill="none" />
    <circle cx="1666" cy="440" r="24" stroke="#0070F3" stroke-width="0.8" stroke-dasharray="6 6" stroke-opacity="0.35" fill="none" />
    <line x1="1666" y1="440" x2="1666" y2="640" stroke="#00DFD8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.45" />

    <!-- Node 4: Right Apex Peak -->
    <circle cx="2233" cy="350" r="5" fill="#7928CA" />
    <circle cx="2233" cy="350" r="12" stroke="#7928CA" stroke-width="1" stroke-opacity="0.45" fill="none" />
    <line x1="2233" y1="350" x2="2233" y2="640" stroke="#7928CA" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.3" />

    <!-- Node 5: Right Mid Valley -->
    <circle cx="2780" cy="510" r="3.5" fill="#00DFD8" />
    <circle cx="2780" cy="510" r="8" stroke="#00DFD8" stroke-width="1" stroke-opacity="0.35" fill="none" />

    <!-- Inter-Node Constellation Connectivity Links -->
    <line x1="550" y1="380" x2="1100" y2="530" stroke="#00DFD8" stroke-width="0.7" stroke-dasharray="3 5" stroke-opacity="0.25" />
    <line x1="1100" y1="530" x2="1666" y2="440" stroke="#0070F3" stroke-width="0.7" stroke-dasharray="3 5" stroke-opacity="0.3" />
    <line x1="1666" y1="440" x2="2233" y2="350" stroke="#7928CA" stroke-width="0.7" stroke-dasharray="3 5" stroke-opacity="0.3" />
    <line x1="2233" y1="350" x2="2780" y2="510" stroke="#00DFD8" stroke-width="0.7" stroke-dasharray="3 5" stroke-opacity="0.25" />
  </g>
</svg>
